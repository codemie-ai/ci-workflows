[changelog]
body = """
{% set repository = get_env(name="GH_REPO", default="codemie-ai/ci-workflows") %}\
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/{{ repository }}/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim }}
{% for commit in entry.commits %}\
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }} \
{% if commit.remote and commit.remote.pr_number %}\
([#{{ commit.remote.pr_number }}](https://github.com/{{ repository }}/pull/{{ commit.remote.pr_number }})) \
{% endif %}\
- \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ repository }}/commit/{{ commit.id }}))
{% if commit.breaking_description %}  {{ commit.breaking_description }}
{% endif %}\
{% endfor %}\
{% endfor %}\
{% if commits | length == 0 %}\
No changes to report.
{% endif %}\
{% if github %}\
{% set new_contributors = github.contributors | filter(attribute="is_first_time", value=true) %}\
{% if new_contributors | length > 0 %}
## ❤️ New Contributors
{% for contributor in new_contributors %}\
- **[@{{ contributor.username }}](https://github.com/{{ contributor.username }})** made their first contribution\
{% if contributor.pr_number %} in [#{{ contributor.pr_number }}](https://github.com/{{ repository }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}\
{% endif %}\
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
protect_breaking_commits = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
use_branch_tags = true
topo_order = true
sort_commits = "oldest"

# Numeric prefixes keep the sections in this order but are hidden in the output.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^docs", group = "<!-- 2 -->📚 Documentation" },
    { message = '^(chore|build|ci)\(deps[^)]*\)', group = "<!-- 3 -->📦 Dependencies" },
    { message = "^ci", group = "<!-- 4 -->⚙️ CI" },
    { message = "^refactor", group = "<!-- 5 -->♻️ Refactoring" },
    { message = "^perf", group = "<!-- 6 -->⚡ Performance" },
    { message = "^test", group = "<!-- 7 -->🧪 Tests" },
    { message = "^style", group = "<!-- 8 -->🎨 Style" },
    { message = "^revert", group = "<!-- 9 -->⏪ Reverts" },
    { message = ".*", group = "<!-- 10 -->🔧 Other Changes" },
]
