name: Build site
description: Checkout repository, install Node.js dependencies and build website

inputs:
  node-version:
    description: Node.js version
    default: '24'
  install-command:
    description: Command to install dependencies
    default: npm ci
  build-command:
    description: Command to build website
    default: npm run build

runs:
  using: composite
  steps:
    - name: Prepare Node.js project
      uses: codemie-ai/ci-workflows/actions/setup-node-project@a797f435a01863295dda1f88f9664682a7adf54d
      with:
        node-version: ${{ inputs.node-version }}
        install-command: ${{ inputs.install-command }}

    - name: Build website
      shell: bash
      run: ${{ inputs.build-command }}
