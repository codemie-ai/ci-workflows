name: Setup Node.js project
description: Checkout repository, set up Node.js with npm caching and install dependencies

inputs:
  node-version:
    description: Node.js version
    default: '24'
  ref:
    description: Git ref or commit SHA to checkout; empty uses the event default
    default: ''
  fetch-depth:
    description: Number of commits to fetch; 0 fetches full history
    default: '1'
  install-command:
    description: Command to install dependencies
    default: npm ci

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: ${{ inputs.install-command }}
