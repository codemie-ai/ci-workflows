name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  git_cliff_version: v2.14.2

jobs:
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Validate version and check tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable version like v1.0.0"
            exit 1
          fi

          # API errors must fail the job, not look like an absent tag.
          refs="$(gh api \
            "repos/$GH_REPO/git/matching-refs/tags/$VERSION")"

          if jq -e --arg ref "refs/tags/$VERSION" \
            'any(.[]; .ref == $ref)' <<< "$refs" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: ${{ env.git_cliff_version }}
          config: cliff.toml
          args: --github-repo ${{ github.repository }} --unreleased --tag ${{ inputs.version }} --output release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$VERSION" \
            --repo "$GH_REPO" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md
