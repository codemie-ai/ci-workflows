name: Reusable Knip

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing package.json and knip configuration
        type: string
        default: .
      node-version:
        description: Node.js version
        type: string
        default: '20'
      runner:
        description: GitHub Actions runner label
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Maximum time in minutes for the job to run
        type: number
        default: 10

permissions:
  contents: read

jobs:
  knip:
    name: Unused Code & Dependencies Check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Knip check
        run: npm run knip:check
