name: Reusable Release Version Check

on:
  workflow_call:
    inputs:
      ecosystem:
        description: Package ecosystem ('npm' or 'pypi')
        type: string
        required: true
      package-name:
        description: Name of the package to verify
        type: string
        required: true
      tag:
        description: Release tag to check (e.g. cdk-v0.2.1, python-v0.1.0)
        type: string
        required: true
      tag-prefix:
        description: Optional prefix for release tag (e.g. cdk-v)
        type: string
        required: false
        default: ''
      base-version:
        description: Baseline version from manifest (MAJOR.MINOR or MAJOR.MINOR.0)
        type: string
        required: true
      verify-tag-on-main:
        description: Whether to verify that the tagged commit is an ancestor of main
        type: boolean
        required: false
        default: true
      ci-workflows-ref:
        description: Branch, tag, or SHA of ci-workflows to fetch check_version.py from
        type: string
        required: false
        default: main
      python-version:
        description: Python version
        type: string
        required: false
        default: '3.12'
      runner:
        description: GitHub Actions runner label
        type: string
        required: false
        default: ubuntu-latest
    outputs:
      version:
        description: Validated version string
        value: ${{ jobs.check.outputs.version }}

permissions:
  contents: read

jobs:
  check:
    name: Release version check
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.parse_version.outputs.version }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout version check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codemie-ai/ci-workflows
          ref: ${{ inputs.ci-workflows-ref }}
          path: .ci-workflows-temp
          sparse-checkout: |
            scripts/release/check_version.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup version check script
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-workflows-scripts"
          cp .ci-workflows-temp/scripts/release/check_version.py "${RUNNER_TEMP}/ci-workflows-scripts/check_version.py"
          rm -rf .ci-workflows-temp

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verify tag on commit
        id: tag_commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAGGED=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}") || {
            echo "::error::Tag '$RELEASE_TAG' does not exist"
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = "release" ] || [ "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" ]; then
            if [ -n "$GITHUB_SHA" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::Tag '$RELEASE_TAG' points to $TAGGED, not to run commit $GITHUB_SHA"
              exit 1
            fi
          fi
          echo "tagged=$TAGGED" >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit on main
        if: inputs.verify-tag-on-main
        shell: bash
        env:
          TAGGED: ${{ steps.tag_commit.outputs.tagged }}
        run: |
          if ! git merge-base --is-ancestor "$TAGGED" origin/main; then
            echo "::error::The tagged commit $TAGGED is not on main"
            exit 1
          fi

      - name: Parse version from tag
        id: parse_version
        shell: bash
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          RELEASE_TAG: ${{ inputs.tag }}
          BASE_VERSION: ${{ inputs.base-version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          ARGS=("--ecosystem" "$ECOSYSTEM" "--name" "$PACKAGE_NAME" "--tag" "$RELEASE_TAG" "--base" "$BASE_VERSION")
          if [ -n "$TAG_PREFIX" ]; then
            ARGS+=("--tag-prefix" "$TAG_PREFIX")
          fi
          VERSION=$(python3 "${RUNNER_TEMP}/ci-workflows-scripts/check_version.py" "${ARGS[@]}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version against registry
        shell: bash
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          VERSION: ${{ steps.parse_version.outputs.version }}
        run: |
          python3 "${RUNNER_TEMP}/ci-workflows-scripts/check_version.py" --ecosystem "$ECOSYSTEM" --name "$PACKAGE_NAME" --version "$VERSION"

      - name: Release version check summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          RELEASE_TAG: ${{ inputs.tag }}
          BASE_VERSION: ${{ inputs.base-version }}
          VERSION: ${{ steps.parse_version.outputs.version }}
        run: |
          echo "### Release Version Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" = "success" ]; then
            echo "- **Status:** Passed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Package:** \`$PACKAGE_NAME\` ($ECOSYSTEM)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Base Version:** \`$BASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Validated Version:** \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Package:** \`$PACKAGE_NAME\` ($ECOSYSTEM)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Base Version:** \`$BASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$VERSION" ]; then
              echo "- **Parsed Version:** \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
