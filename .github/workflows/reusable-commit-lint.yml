# Reusable PR Title Validation Workflow
#
# Strategy:
# Repositories use Squash and Merge so that branch commit history is squashed into
# a single commit on the default branch (main). The commit message is taken directly
# from the Pull Request title. Therefore, only the PR title needs to be validated
# against Conventional Commits, giving developers freedom in naming intermediate branch commits.
#
# Required Repository Merge Configuration:
# To ensure only a single commit with a validated PR title lands in main:
#
# Option A: Configure via GitHub CLI (gh):
#   gh repo edit <owner>/<repo> --enable-squash-merge --enable-rebase-merge=false --enable-merge-commit=false
#   gh api -X PATCH "repos/<owner>/<repo>" -f squash_merge_commit_title="PR_TITLE" -f squash_merge_commit_message="BLANK"
#
# Option B: Configure via GitHub UI (Settings -> General -> Pull Requests):
#   [x] Allow squash merging
#       Default commit title: Pull request title
#       Default commit message: Blank (or Pull request description)
#   [ ] Allow merge commits (unchecked)
#   [ ] Allow rebase merging (unchecked)
#   [x] Automatically delete head branches (checked)

name: Reusable PR Title Lint

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        type: string
        default: ubuntu-latest
      node-version:
        description: Node.js version
        type: string
        default: '24'

permissions:
  contents: read

env:
  commitlint_version: 21.2.4
  commitlint_config_version: 21.2.4

jobs:
  lint:
    name: PR Title Validation
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@${commitlint_version} @commitlint/config-conventional@${commitlint_config_version}

      - name: Print version of commitlint
        run: |
          npx commitlint --version

      - name: Ensure commitlint configuration
        shell: bash
        run: |
          CONFIG_FOUND=false
          for cfg in \
            commitlint.config.js commitlint.config.cjs commitlint.config.mjs commitlint.config.ts \
            .commitlintrc .commitlintrc.json .commitlintrc.yaml .commitlintrc.yml .commitlintrc.js .commitlintrc.cjs; do
            if [ -f "$cfg" ]; then
              echo "::notice::Using repository commitlint configuration: $cfg"
              CONFIG_FOUND=true
              break
            fi
          done

          if [ "$CONFIG_FOUND" = "false" ] && [ -f "package.json" ]; then
            if grep -q '"commitlint"' package.json 2>/dev/null; then
              echo "::notice::Using commitlint configuration from package.json"
              CONFIG_FOUND=true
            fi
          fi

          if [ "$CONFIG_FOUND" = "false" ]; then
            echo "::notice::No commitlint configuration found. Generating default .commitlintrc.json"
            cat <<'EOF' > .commitlintrc.json
          {
            "extends": ["@commitlint/config-conventional"],
            "rules": {
              "body-max-line-length": [2, "always", 300],
              "footer-max-line-length": [2, "always", 300]
            }
          }
          EOF
          fi

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating PR title: $PR_TITLE"
          set -o pipefail
          echo "$PR_TITLE" | npx commitlint --color=false --verbose 2>&1 | tee "${RUNNER_TEMP}/commitlint.log"

      - name: Validation summary
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### Conventional Commits Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Title:** \`$PR_TITLE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Base branch:** \`$BASE_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Head branch:** \`$HEAD_REF\`" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "- **Result:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "PR titles must follow the Conventional Commits format: \`<type>(<scope>): <description>\`" >> $GITHUB_STEP_SUMMARY
            if [ -f "${RUNNER_TEMP}/commitlint.log" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### Commitlint Output" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              cat "${RUNNER_TEMP}/commitlint.log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi
