name: Reusable Publish NPM

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the artifact containing the npm package to publish
        type: string
        required: true
      dist-tag:
        description: npm distribution tag
        type: string
        default: latest
        required: false
      access:
        description: npm package access level
        type: string
        default: public
        required: false
      node-version:
        description: Node.js version to use for publishing
        type: string
        default: '20'
        required: false
      runner:
        description: GitHub Actions runner label
        type: string
        default: ubuntu-latest
        required: false
      registry-url:
        description: npm registry URL
        type: string
        default: https://registry.npmjs.org
        required: false
      provenance:
        description: Whether to generate provenance statements
        type: boolean
        default: false
        required: false
    secrets:
      npm-token:
        description: npm authentication token (optional if using OIDC / provenance)
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/npm-package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: Publish package to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
          PACKAGE_DIR: ${{ runner.temp }}/npm-package
          DIST_TAG: ${{ inputs.dist-tag }}
          ACCESS: ${{ inputs.access }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          set -euo pipefail

          cd "$PACKAGE_DIR"

          shopt -s nullglob globstar
          tgz_files=( **/*.tgz )
          shopt -u nullglob globstar

          extra_args=()
          if [ "$PROVENANCE" = "true" ]; then
            extra_args+=(--provenance)
          fi

          if [ ${#tgz_files[@]} -gt 0 ]; then
            for tgz in "${tgz_files[@]}"; do
              echo "Publishing tarball: $tgz with access=$ACCESS, tag=$DIST_TAG"
              npm publish "$tgz" --access "$ACCESS" --tag "$DIST_TAG" "${extra_args[@]}"
            done
          elif [ -f "package.json" ]; then
            echo "Publishing package directory with access=$ACCESS, tag=$DIST_TAG"
            npm publish . --access "$ACCESS" --tag "$DIST_TAG" "${extra_args[@]}"
          else
            shopt -s nullglob globstar
            pkg_dirs=( **/package.json )
            shopt -u nullglob globstar
            if [ ${#pkg_dirs[@]} -gt 0 ]; then
              target_dir="$(dirname "${pkg_dirs[0]}")"
              echo "Publishing nested package directory ($target_dir) with access=$ACCESS, tag=$DIST_TAG"
              npm publish "$target_dir" --access "$ACCESS" --tag "$DIST_TAG" "${extra_args[@]}"
            else
              echo "::error::No .tgz package or package.json found in downloaded artifact"
              exit 1
            fi
          fi

      - name: Publish summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          DIST_TAG: ${{ inputs.dist-tag }}
          ACCESS: ${{ inputs.access }}
        run: |
          echo "### npm Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`$ARTIFACT_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dist-tag:** \`$DIST_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Access:** \`$ACCESS\`" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "- **Result:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
