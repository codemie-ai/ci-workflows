name: Publish to PyPI
description: >-
  Downloads a distribution artifact and publishes it to PyPI with Trusted Publishing.
  A composite action runs inside the caller's job, so the OIDC token names the caller's
  workflow. A reusable workflow cannot be used for Trusted Publishing, so use this action
  instead of reusable-publish-pypi.yml when publishing without an API token.

inputs:
  artifact-name:
    description: Name of the artifact containing distribution packages to publish
    required: true
  packages-dir:
    description: Directory containing packages to publish
    required: false
    default: dist/
  attestations:
    description: Enable support for PEP 740 attestations
    required: false
    default: 'true'
  verbose:
    description: Show verbose output during publish
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.packages-dir }}

    - name: Publish to PyPI (Trusted Publishing)
      id: publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: ${{ inputs.packages-dir }}
        attestations: ${{ inputs.attestations }}
        verbose: ${{ inputs.verbose }}

    - name: Publish summary
      if: always()
      shell: bash
      env:
        PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
      run: |
        {
          echo "### PyPI Publish Summary"
          echo ""
          echo "- **Artifact:** \`$ARTIFACT_NAME\`"
          echo "- **Packages Dir:** \`$PACKAGES_DIR\`"
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "- **Result:** Passed"
          else
            echo "- **Result:** Failed"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
